version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      WS_PATH: /ws
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mmo
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
